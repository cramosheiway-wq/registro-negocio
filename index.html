<script>
    const IMGBB_API_KEY = "f668f5709ccca080d9866e501191aab3"; 
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0t1_IvVtKAYJ2UWHBOMBGpLFqxwRYjOnHOjd1zI7xLhMunq1-Mf_Vj6L_W-Sios4vYw/exec";

    function log(text) {
        const box = document.getElementById('debugLog');
        box.style.display = 'block';
        box.innerHTML += "<br>" + text;
    }

    function obtenerUbicacion() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lng').value = pos.coords.longitude;
            }, err => console.log("GPS error: " + err.message), { enableHighAccuracy: true });
        }
    }

    window.onload = obtenerUbicacion;

    function formatearCoordenada(valor, tipo = "lat") {
        if (!valor || valor === "S/N") return "S/N";
        const str = String(valor).trim();
        const esNegativo = str.startsWith("-") || tipo === "lng";
        const digitos = str.replace(/[^0-9]/g, "");

        if (!digitos || digitos.length < 4) return str;

        const enteros = tipo === "lng" ? 3 : 2;
        if (digitos.length <= enteros) {
            return (esNegativo ? "-" : "") + digitos;
        }

        const limpia = `${digitos.slice(0, enteros)}.${digitos.slice(enteros)}`;
        return esNegativo ? `-${limpia}` : limpia;
    }

    async function subirAImgBB(fileInputId) {
        const fileInput = document.getElementById(fileInputId);
        if (!fileInput.files || fileInput.files.length === 0) return "";

        log(`Subiendo ${fileInputId} a ImgBB...`);
        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append("image", file);

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
        });
        const result = await res.json();
        if (result.success) {
            log(`¡${fileInputId} subida con éxito!`);
            return result.data.url;
        } else {
            throw new Error(result.error.message || "Error al subir imagen");
        }
    }

    async function enviarRegistro() {
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        document.getElementById('debugLog').innerHTML = "Procesando envío...";

        try {
            const urlIne = await subirAImgBB('fotoIne');
            const urlFachada = await subirAImgBB('fotoFachada');

            log("Enviando datos a Google Sheets...");

            const latLimpia = formatearCoordenada(document.getElementById('lat').value, "lat");
            const lngLimpia = formatearCoordenada(document.getElementById('lng').value, "lng");

            const params = new URLSearchParams({
                rutaPreventa: document.getElementById('rutaPreventa').value,
                frecuencia: document.getElementById('frecuencia').value,
                rutaReparto: document.getElementById('rutaReparto').value,
                nombreNegocio: document.getElementById('nombreNegocio').value,
                calle: document.getElementById('calle').value,
                colonia: document.getElementById('colonia').value,
                numero: document.getElementById('numero').value,
                ciudad: document.getElementById('ciudad').value,
                estado: document.getElementById('estado').value,
                responsable: document.getElementById('responsable').value,
                telefono: document.getElementById('telefono').value,
                lat: latLimpia || "S/N",
                lng: lngLimpia || "S/N",
                urlIne: urlIne,
                urlFachada: urlFachada,
                pedido: document.getElementById('pedido').value
            });

            const img = new Image();
            img.src = APPS_SCRIPT_URL + "?" + params.toString();

            log("¡Registro enviado correctamente!");
            
            setTimeout(() => {
                alert("¡Registro guardado con éxito!");
                document.getElementById('formNegocio').reset();
                obtenerUbicacion();
                btn.disabled = false;
            }, 2000);

        } catch (error) {
            log("Error: " + error.message);
            alert("Error: " + error.message);
            btn.disabled = false;
        }
    }
</script>
