<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alta de Negocio - Campo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; background: #fff; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #debugLog { margin-top: 15px; padding: 10px; background: #222; color: #00ff00; font-family: monospace; font-size: 12px; border-radius: 5px; max-height: 150px; overflow-y: auto; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registro de Negocio</h2>
    <form id="formNegocio" onsubmit="event.preventDefault(); enviarRegistro();">
        
        <div class="form-group"><label>Ruta Preventa:</label><input type="text" id="rutaPreventa" required></div>
        <div class="form-group"><label>Frecuencia:</label><input type="text" id="frecuencia" required></div>
        <div class="form-group"><label>Ruta de Reparto:</label><input type="text" id="rutaReparto" required></div>
        <div class="form-group"><label>Nombre del Cliente (Negocio):</label><input type="text" id="nombreNegocio" required></div>
        <div class="form-group"><label>Calle:</label><input type="text" id="calle" required></div>
        <div class="form-group"><label>Colonia:</label><input type="text" id="colonia" required></div>
        <div class="form-group"><label>Número:</label><input type="text" id="numero" required></div>
        <div class="form-group"><label>Ciudad:</label><input type="text" id="ciudad" value="Gómez Palacio" required></div>
        <div class="form-group"><label>Estado:</label><input type="text" id="estado" value="Durango" required></div>
        <div class="form-group"><label>Responsable:</label><input type="text" id="responsable" value="" required></div>
        <div class="form-group"><label>Teléfono:</label><input type="tel" id="telefono"></div>

        <div class="form-group">
            <label>Foto INE Dueño:</label>
            <input type="file" id="fotoIne" accept="image/*" capture="environment" required>
        </div>

        <div class="form-group">
            <label>Foto Frente (Fachada):</label>
            <input type="file" id="fotoFachada" accept="image/*" capture="environment" required>
        </div>

        <input type="hidden" id="lat">
        <input type="hidden" id="lng">

        <button type="submit" id="btnEnviar">Guardar Registro</button>
        <div id="debugLog">Iniciando...</div>
    </form>
</div>

<script>
    const IMGBB_API_KEY = "f668f5709ccca080d9866e501191aab3"; 
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzT8VFNAfrc8tJYfmRvqzf4qTfCtjR6PreTCRJUCno3zaeoj3KSXB8U0TtSPuAvP6Nm9Q/exec";

    function log(text) {
        const box = document.getElementById('debugLog');
        box.style.display = 'block';
        box.innerHTML += "<br>" + text;
        console.log(text);
    }

    window.onload = function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lng').value = pos.coords.longitude;
                log("GPS obtenido.");
            }, err => log("GPS error: " + err.message), { enableHighAccuracy: true });
        }
    };
